services:
  validator:
    image: apps4everything/kosit-validator-xrechnung:3.0.2-1
    container_name: rechnungsmonster-validator

  backend:
    build: ./backend
    container_name: rechnungsmonster-backend
    ports:
      - "8020:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/main.py:/app/main.py
    environment:
      - VALIDATOR_URL=http://validator:8081
      - KOSIT_XRECHNUNG_VERSION=3.0.2
      - KOSIT_VALIDATOR_VERSION=1.6.1
      - VERAPDF_VERSION=1.30.1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - validator

  frontend:
    build: ./frontend
    container_name: rechnungsmonster-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
