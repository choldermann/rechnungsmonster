server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Vite-Build: der Dateiname traegt einen Content-Hash, eine Aenderung
    # ergibt einen neuen Namen. Ein Jahr ist deshalb unbedenklich.
    # ^~ statt / , damit der Regex-Block weiter unten hier nicht greift.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Statische Dateien ohne Hash im Namen. Das =404 haelt sie ausserdem aus
    # dem SPA-Fallback heraus -- der lieferte bisher fuer jeden unbekannten
    # Pfad das komplette index.html mit Status 200 aus.
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|eot|css|js|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
